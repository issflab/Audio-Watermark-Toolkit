# Demo config: single file (demo_audio.mp3 -> wav), user "kamala", then eval + attacks
paths:
  clean_dir: "demo/clean"
  marked_dir: "demo/marked"

embed:
  enabled: true
  suffix: "_selwm"
  alpha: 0.8
  device: "cpu"
  win_sec: 1.5
  fade_ms: 50
  top_k: 2
  silence_rel: 0.15
  max_mark_fraction: 0.60
  bands: "20-300,300-3000,3000-7600"
  message_bits: null
  message_bit_len: 16

eval:
  enabled: true
  out_dir: "demo/outputs"
  compute_marked_pesq: true
  compute_marked_detection: true
